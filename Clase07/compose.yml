services:
  server-mysql:
    image: mysql:8
    container_name: server-mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: 12345
    networks:
      - net-apps

  client-mysql:
    image: phpmyadmin:5.2.2
    container_name: client_mysql
    ports:
      - 9000:80
    environment:
      PMA_HOST: server-mysql
      PMA_PORT: 3306
      PMA_USER: user
      PMA_PASSWORD: 12345
    networks:
      - net-apps

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - 3000:3000
    networks:
      - net-apps
    depends_on:
      - backend1

  backend1:
    build:
      context: ./backend1
    container_name: backend1
    ports:
      - 4000:4000
    networks:
      - net-apps
    depends_on:
      - server-mysql
      - backend2

  backend2:
    build:
      context: ./backend2
    container_name: backend2
    ports:
      - 5000:5000
    networks:
      - net-apps
    depends_on:
      - server-mysql

networks:
  net-apps:
    driver: bridge